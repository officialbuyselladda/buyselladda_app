name: deal
description: "DealKro - OLX-like Flutter mobile app integrated with Node.js backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Network & API
  dio: ^5.7.0
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Location
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  # UI & Anim
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  # Socket for chat
  socket_io_client: 3.1.4
  # Env
  flutter_dotenv: ^5.2.1
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/animations/

